<svg xmlns="http://www.w3.org/2000/svg" width="360" height="176" viewBox="0 0 360 176" role="img" aria-label="A program drawn as a flow chart">
  <style>
    .box { fill: none; stroke: var(--vscode-foreground, #cccccc); }
    .t { font-family: var(--vscode-font-family, sans-serif); font-size: 11px; fill: var(--vscode-foreground, #cccccc); }
    .s { font-family: var(--vscode-font-family, sans-serif); font-size: 10px; fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .a { stroke: var(--vscode-foreground, #cccccc); fill: none; }
  </style>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--vscode-foreground, #cccccc)"/></marker>
  </defs>
  <rect class="box" x="120" y="8" width="120" height="34" rx="6"/>
  <text class="t" x="180" y="29" text-anchor="middle">LBL[10]</text>

  <polygon class="box" points="180,60 262,86 180,112 98,86"/>
  <text class="t" x="180" y="90" text-anchor="middle">IF ... THEN</text>

  <rect class="box" x="20" y="128" width="120" height="34" rx="6"/>
  <text class="t" x="80" y="149" text-anchor="middle">CALL LOAD</text>
  <rect class="box" x="220" y="128" width="120" height="34" rx="6"/>
  <text class="t" x="280" y="149" text-anchor="middle">JMP LBL[10]</text>

  <line class="a" x1="180" y1="42" x2="180" y2="60" marker-end="url(#d)"/>
  <line class="a" x1="98" y1="86" x2="80" y2="128" marker-end="url(#d)"/>
  <text class="s" x="66" y="112" text-anchor="middle">TRUE</text>
  <line class="a" x1="262" y1="86" x2="280" y2="128" marker-end="url(#d)"/>
  <text class="s" x="300" y="112" text-anchor="middle">FALSE</text>
</svg>
