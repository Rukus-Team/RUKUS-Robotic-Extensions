<svg xmlns="http://www.w3.org/2000/svg" width="360" height="184" viewBox="0 0 360 184" role="img" aria-label="The Robot Code panel in the Activity Bar">
  <rect x="1" y="1" width="358" height="182" rx="6" fill="none" stroke="var(--vscode-panel-border, #3c3c3c)"/>
  <rect x="10" y="10" width="26" height="164" rx="4" fill="var(--vscode-activityBar-background, #333333)"/>
  <circle cx="23" cy="28" r="6" fill="var(--vscode-foreground, #cccccc)"/>
  <rect x="17" y="46" width="12" height="12" rx="2" fill="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <rect x="17" y="66" width="12" height="12" rx="2" fill="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="50" y="32" font-family="var(--vscode-font-family, sans-serif)" font-size="12" font-weight="600" fill="var(--vscode-foreground, #cccccc)">Robot Code</text>
  <text x="50" y="58" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-foreground, #cccccc)">Programs  (TP)</text>
  <text x="50" y="78" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-foreground, #cccccc)">PC programs  (KAREL)</text>
  <text x="50" y="98" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-foreground, #cccccc)">Macros</text>
  <text x="50" y="118" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-foreground, #cccccc)">Data  (registers, I/O)</text>
  <text x="50" y="146" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-descriptionForeground, #9d9d9d)">Snapshot</text>
  <text x="50" y="166" font-family="var(--vscode-font-family, sans-serif)" font-size="11" fill="var(--vscode-descriptionForeground, #9d9d9d)">Controllers  (once a robot is set up)</text>
</svg>
