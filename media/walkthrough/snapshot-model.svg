<svg xmlns="http://www.w3.org/2000/svg" width="400" height="168" viewBox="0 0 400 168" role="img" aria-label="Your files, the snapshot, and the robot">
  <style>
    .box { fill: none; stroke: var(--vscode-foreground, #cccccc); }
    .t { font-family: var(--vscode-font-family, sans-serif); font-size: 12px; fill: var(--vscode-foreground, #cccccc); }
    .s { font-family: var(--vscode-font-family, sans-serif); font-size: 10px; fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .a { stroke: var(--vscode-charts-blue, #3794ff); fill: none; }
  </style>
  <rect class="box" x="8" y="52" width="104" height="52" rx="6"/>
  <text class="t" x="60" y="74" text-anchor="middle">Your files</text>
  <text class="s" x="60" y="90" text-anchor="middle">working tree</text>

  <rect class="box" x="148" y="52" width="104" height="52" rx="6"/>
  <text class="t" x="200" y="74" text-anchor="middle">Snapshot</text>
  <text class="s" x="200" y="90" text-anchor="middle">last known state</text>

  <rect class="box" x="288" y="52" width="104" height="52" rx="6"/>
  <text class="t" x="340" y="74" text-anchor="middle">Robot</text>
  <text class="s" x="340" y="90" text-anchor="middle">the controller</text>

  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--vscode-charts-blue, #3794ff)"/></marker>
  </defs>
  <line class="a" x1="288" y1="68" x2="252" y2="68" marker-end="url(#h)"/>
  <text class="s" x="270" y="60" text-anchor="middle">Fetch</text>
  <line class="a" x1="148" y1="86" x2="112" y2="86" marker-end="url(#h)"/>
  <text class="s" x="130" y="102" text-anchor="middle">Pull</text>
  <line class="a" x1="112" y1="116" x2="300" y2="116" marker-end="url(#h)"/>
  <text class="s" x="206" y="132" text-anchor="middle">Push (checked against the snapshot first)</text>
</svg>
