name: Feature request
description: An idea that would make RUKUS Robotic Extensions more useful on your cells
labels: [enhancement, beta]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public:** keep customer programs, plant names and IP addresses out of it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you are doing and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working, if you have an idea.
  - type: input
    id: controller
    attributes:
      label: Controller / robot brand
      description: e.g. FANUC V9.40 SpotTool+, ABB IRC5
