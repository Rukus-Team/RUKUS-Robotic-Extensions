name: Bug report
description: Something in Robot Code does not work the way it should
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the Robot Code beta. **This repository is public:** do not paste customer
        programs, plant or customer names, IP addresses, or anything else you would not post online.
        A small made-up `.ls`/`.kl` that shows the problem is the most useful thing you can attach.

        Tip: **Robot Code: Report an Issue** in VS Code's command palette opens this form with the
        versions below already filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .ls file with ...
        2. Run ...
        3. See ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - TP editing (.ls)
        - KAREL (.kl / ktrans)
        - Registers / I-O comments / backups
        - Live robot connection (fetch / push / running line)
        - Teaching or moving positions
        - RUKUS integration
        - Notepad++ package
        - Other
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Robot Code version
      description: Extensions view -> Robot Code, or filled in by the Report an Issue command
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: controller
    attributes:
      label: Controller
      description: Software version and tool if it matters (e.g. V9.40 HandlingTool, ROBOGUIDE or a real cell)
  - type: textarea
    id: logs
    attributes:
      label: Output or error text
      description: View -> Output -> pick "Robot Code" in the list, and paste anything relevant.
      render: text
